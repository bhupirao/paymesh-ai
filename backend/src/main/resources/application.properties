
spring.application.name=paymesh-backend
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
spring.flyway.locations=classpath:db/migration

# PostgreSQL configuration
spring.datasource.url=${PAYMESH_DB_URL:jdbc:postgresql://localhost:5432/paymesh_db}
spring.datasource.username=${PAYMESH_DB_USER:paymesh_user}
spring.datasource.password=${PAYMESH_DB_PASSWORD}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jpa.open-in-view=false

# No usable default secrets. Webhook/admin endpoints fail closed until configured.
paymesh.webhooks.razorpay-secret=${PAYMESH_RAZORPAY_WEBHOOK_SECRET:}
paymesh.webhooks.stripe-secret=${PAYMESH_STRIPE_WEBHOOK_SECRET:}
paymesh.settlement.admin-token=${PAYMESH_SETTLEMENT_ADMIN_TOKEN:}
# Explicit opt-in to background writes; manual reconciliation remains available.
paymesh.settlement.scheduling-enabled=${PAYMESH_SETTLEMENT_SCHEDULING_ENABLED:false}
paymesh.settlement.poll-ms=${PAYMESH_SETTLEMENT_POLL_MS:30000}

# Explicitly disabled unless the demo profile is active and the local demo DB is verified.
paymesh.demo.gateway-timeout.enabled=${PAYMESH_DEMO_GATEWAY_TIMEOUT_ENABLED:false}

# Phase 3A: no fallback/generated JWT keys. All four values are required together.
# Files must be secret-mounted PEM files: PKCS#8 RSA private, X.509 RSA public.
paymesh.jwt.private-key-file=${PAYMESH_JWT_PRIVATE_KEY_FILE:}
paymesh.jwt.public-key-file=${PAYMESH_JWT_PUBLIC_KEY_FILE:}
paymesh.jwt.issuer=${PAYMESH_JWT_ISSUER:}
paymesh.jwt.audience=${PAYMESH_JWT_AUDIENCE:}
paymesh.auth.login.max-attempts=${PAYMESH_LOGIN_MAX_ATTEMPTS:10}
paymesh.auth.login.window-seconds=${PAYMESH_LOGIN_WINDOW_SECONDS:60}
paymesh.auth.login.max-clients=${PAYMESH_LOGIN_MAX_CLIENTS:10000}

# Internal loopback-only Python investigation client; no retries or credential forwarding.
paymesh.ai.enabled=${PAYMESH_AI_ENABLED:false}
paymesh.ai.base-url=${PAYMESH_AI_BASE_URL:http://127.0.0.1:8000}
paymesh.ai.connect-timeout-ms=${PAYMESH_AI_CONNECT_TIMEOUT_MS:2000}
paymesh.ai.response-timeout-ms=${PAYMESH_AI_RESPONSE_TIMEOUT_MS:45000}
paymesh.ai.max-response-bytes=${PAYMESH_AI_MAX_RESPONSE_BYTES:262144}
