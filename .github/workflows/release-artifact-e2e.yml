name: Published v1.0.0 artifact API E2E (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-release-artifact-e2e
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'bhupirao/paymesh-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      E2E_VERIFY_QWEN: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline deployment regressions
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - name: Generate hosted-runner-only fixtures
        run: python3 -B deploy/release_artifact_e2e.py fixtures
      - name: Check available disk before pulling
        run: |
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge 6291456 || { echo 'INSUFFICIENT_RUNNER_DISK'; exit 1; }
      - name: Download one checksum-verified small model on runner only
        run: |
          curl --fail --location --silent --show-error --max-time 600 --max-filesize 550000000 \
            --output "$E2E_DIR/qwen.gguf" \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $E2E_DIR/qwen.gguf" | sha256sum --check --status
          chmod 444 "$E2E_DIR/qwen.gguf"
      - name: Validate image-only Compose and pull published artifacts
        run: |
          docker compose --project-name "$E2E_PROJECT" --env-file "$E2E_ENV" -f deploy/compose.release-verify.yaml config --quiet
          docker compose --project-name "$E2E_PROJECT" --env-file "$E2E_ENV" -f deploy/compose.release-verify.yaml pull
      - name: Start five disposable services without builds or further pulls
        id: startup
        run: docker compose --project-name "$E2E_PROJECT" --env-file "$E2E_ENV" -f deploy/compose.release-verify.yaml up -d --no-build --pull never --wait --wait-timeout 240
      - name: Verify published artifacts through real APIs and Qwen
        id: api_e2e
        run: python3 -B deploy/release_artifact_e2e.py run
      - name: Capture bounded redacted failure diagnostics before teardown
        if: ${{ failure() && steps.startup.outcome != 'skipped' && env.E2E_DIR != '' }}
        timeout-minutes: 3
        run: python3 -B deploy/release_artifact_e2e.py diagnostics
      - name: Retain sanitized evidence only
        if: ${{ always() && env.E2E_DIR != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-artifact-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_DIR }}/sanitized-e2e.json
            ${{ env.E2E_DIR }}/diagnostics/*.log
            ${{ env.E2E_DIR }}/diagnostics/status.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 3
          compression-level: 9
      - name: Stop only this hosted-runner project
        if: ${{ always() && env.E2E_DIR != '' }}
        run: python3 -B deploy/release_artifact_e2e.py cleanup
