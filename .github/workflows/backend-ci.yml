name: PayMesh backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install PostgreSQL 16 test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16 postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Run isolated PostgreSQL regression suite
        run: bash scripts/test-isolated.sh

      - name: Package executable Spring Boot JAR
        run: mvn -B clean package -DskipTests

      - name: Validate Compose models using placeholders
        run: |
          mkdir -p "$RUNNER_TEMP/paymesh-ci-jwt"
          export PAYMESH_JWT_KEY_DIR="$RUNNER_TEMP/paymesh-ci-jwt"
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file demo-compose.env.example -f compose.demo.yaml config --quiet

      - name: Build backend image
        run: docker build --tag paymesh-backend:ci .
